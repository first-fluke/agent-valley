# CI Workflow — Agent Valley (Bun + TypeScript monorepo)
#
# Jobs: validate → lint → typecheck → test (parallel after validate)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to validate before release PR merge
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Harness validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # validate.sh Check 5/5 runs `bun run test:coverage`, so Bun + deps must
      # be installed here even though lint/typecheck/test jobs do it too.
      - run: bun install --frozen-lockfile
      - name: Check release version alignment
        run: node scripts/check-release-versions.mjs
      - name: Install supported OMA receipt CLI
        run: |
          OMA_RECEIPT_VERSION="$(bun -e 'import { SUPPORTED_OMA_VERSION } from "./packages/core/src/oma/receipt-adapter.ts"; console.log(SUPPORTED_OMA_VERSION)')"
          bun install --global --ignore-scripts "oh-my-agent@$OMA_RECEIPT_VERSION"
          test "$(oma --version)" = "$OMA_RECEIPT_VERSION"
      - name: Run validate.sh
        env:
          WORKSPACE_ROOT: ${{ runner.temp }}/workspaces
        run: |
          mkdir -p "$WORKSPACE_ROOT"
          chmod +x ./scripts/harness/validate.sh
          ./scripts/harness/validate.sh
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/index.html
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p packages/core/tsconfig.json
      - run: bunx tsc --noEmit -p apps/cli/tsconfig.json
      - run: bunx tsc --noEmit --incremental false -p apps/dashboard/tsconfig.json

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: mkdir -p "$WORKSPACE_ROOT" && bun run test
        env:
          WORKSPACE_ROOT: ${{ runner.temp }}/workspaces

  distribution:
    name: Node CLI distribution
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/cli build
      - run: node scripts/verify-cli-package.mjs apps/cli/dist/npm
