# valley.yaml — Agent Valley project configuration
#
# This file defines project-specific settings for the Symphony orchestrator.
# User-scoped settings (API key, defaults) go in ~/.config/agent-valley/settings.yaml
#
# Run `av setup` to generate both files interactively.

# ── Tracker Selector (v0.2+) ──────────────────────────────────────────
# Picks which IssueTracker + WebhookReceiver adapter to use.
# Omit to default to "linear" (matches v0.1 behavior).
# tracker:
#   kind: linear                    # linear | github

# ── Linear Issue Tracker ──────────────────────────────────────────────
linear:
  # team_id: ACR                    # Linear team short code
  # team_uuid: uuid-xxx             # Linear team UUID
  # webhook_secret: whsec_xxx       # Linear webhook signing secret
  workflow_states:
    # todo: state-uuid              # "Todo" workflow state ID
    # in_progress: state-uuid       # "In Progress" workflow state ID
    # done: state-uuid              # "Done" workflow state ID
    # cancelled: state-uuid         # "Cancelled" workflow state ID

# ── GitHub Issues Tracker (v0.2+, optional) ───────────────────────────
# Used when tracker.kind = github. Labels are used instead of workflow
# states — see packages/core/src/tracker/adapters/github-adapter.ts for
# the label ↔ state mapping.
# github:
#   token: ghp_xxx                  # GitHub PAT or fine-grained token
#   owner: my-org
#   repo: my-repo
#   webhook_secret: whsec_xxx       # HMAC-SHA256 signing secret (X-Hub-Signature-256)

# ── Workspace ─────────────────────────────────────────────────────────
workspace:
  # root: /absolute/path/to/workspaces  # Where agents create git worktrees

# ── Agent ─────────────────────────────────────────────────────────────
# agent:
#   type: claude                    # claude | codex | gemini (overrides global default)
#   max_parallel: 3                 # Max concurrent agent runs. Default: hardware-detected
#                                    # recommendation. An explicit value above the recommendation
#                                    # is honored (never silently clamped) but logged as a WARN.

# ── Delivery ──────────────────────────────────────────────────────────
delivery:
  mode: merge                       # merge (auto merge+push) | pr (create PR for review)

# ── Prompt Template ───────────────────────────────────────────────────
# Template variables: {{issue.identifier}}, {{issue.title}}, {{issue.description}},
# {{workspace_path}}, {{attempt.id}}, {{retry_count}}, {{retry_reason}}
prompt: |
  You are working on {{issue.identifier}}: {{issue.title}}.

  ## Description
  {{issue.description}}

  ## Workspace
  Path: {{workspace_path}}

  ## Instructions
  1. Read AGENTS.md first — this repo ships an oma harness (workflows + skills).
  2. This runs non-interactively (agent CLIs use --print / headless mode), so
     keyword-triggered hooks may not auto-activate. Explicitly follow the
     relevant oma workflow for non-trivial work (e.g. `work` for step-by-step,
     `ultrawork` for gated multi-phase) and invoke the matching domain skills.
  3. Implement the requested changes.
  4. Run tests before finishing.

# ── Multi-Repo Routing (optional) ────────────────────────────────────
# routing:
#   rules:
#     - label: "scope:backend"
#       workspace_root: /path/to/backend-repo
#       agent_type: codex
#       delivery_mode: pr
#       verify_command: "pytest && mypy ."   # overrides verify.command below for this route
#     - label: "scope:frontend"
#       workspace_root: /path/to/frontend-repo

# ── Verification Gate (optional) ───────────────────────────────────────
# Runs the project's own test/lint/typecheck command inside the agent's
# worktree before delivery (merge/PR) and before the issue transitions to
# Done. "Done" without this block means only that the agent process exited
# without error — no test/lint/typecheck is run. On failure, the agent gets
# another attempt through the existing retry queue (agent.max_retries) with
# the captured failure output as context; once retries are exhausted the
# issue is cancelled with an actionable comment instead of being merged.
# Omit this block to disable the gate (pre-gate behavior, unchanged).
# verify:
#   command: "bun run typecheck && bun test"  # any shell command; non-zero exit = fail
#   timeout_sec: 600                          # kill the command after N seconds (default 600)

# ── Score-Based Routing (optional) ───────────────────────────────────
# scoring:
#   model: haiku
#   routes:
#     easy:
#       min: 1
#       max: 3
#       agent: gemini
#     medium:
#       min: 4
#       max: 7
#       agent: codex
#     hard:
#       min: 8
#       max: 10
#       agent: claude

# ── Agent Budget Caps (v0.2+, optional) ───────────────────────────────
# Per-issue and per-day token / USD limits. Budget is evaluated before
# each spawn — exceeding a cap cancels the issue with an actionable
# comment instead of spawning. Omit the whole block to disable.
# budget:
#   per_issue:
#     tokens: 2000000               # Max tokens (input + output) per issue
#     usd: 5.00                     # Max estimated cost (USD) per issue
#   per_day:
#     tokens: 20000000              # Team-wide daily token ceiling
#     usd: 50.00                    # Team-wide daily USD ceiling

# ── Tunnel (v0.3+, optional) ──────────────────────────────────────────
# Public URL tunnel used to receive webhooks on localhost. Omit the
# block to keep the v0.2 default (ngrok).
#   provider: cloudflare | ngrok | none
#     cloudflare — spawn `cloudflared`; see cloudflare.mode below.
#     ngrok      — default; requires `brew install ngrok` on PATH.
#     none       — no tunnel; use an external reverse proxy or a
#                  pre-configured cloudflared sidecar.
# Cloudflare modes:
#   quick — spawns `cloudflared tunnel --url http://localhost:{port}`.
#           Cloudflare mints a random *.trycloudflare.com URL. No account
#           or DNS setup required.
#   named — runs a pre-registered tunnel (`cloudflared tunnel create <name>`).
#           Requires `name`; `hostname` is optional and only used to
#           display the webhook URL to the operator.
# tunnel:
#   provider: cloudflare
#   cloudflare:
#     mode: quick
#     # name: av-webhook          # required when mode: named
#     # hostname: webhook.example.com  # UI-only, used when mode: named

# ── Observability (v0.2+, optional) ───────────────────────────────────
# OpenTelemetry OTLP HTTP tracing + Prometheus metrics. Both default to
# off — enable per deployment. Exporter errors are swallowed inside the
# hooks and never affect orchestrator flow. When otel.enabled is true but
# otel.endpoint / otel.service_name are omitted, they fall back to the
# standard OTEL_EXPORTER_OTLP_ENDPOINT / OTEL_SERVICE_NAME env vars (then
# to "agent-valley"), so a collector configured purely via env vars works
# without editing this file. Emitted spans/metrics follow GenAI semantic
# conventions v1.43 (gen_ai.* span attributes + a gen_ai.client.token.usage
# histogram) — see docs/harness/SAFETY.md.
# observability:
#   otel:
#     enabled: false
#     endpoint: http://localhost:4318   # OTLP HTTP collector
#     service_name: agent-valley
#   prometheus:
#     enabled: false
#     path: /api/metrics                # Served by apps/dashboard

# ── Team Dashboard / Ledger Relay (optional) ──────────────────────────
# Streams orchestrator events (node.join, issue lifecycle, etc.) to a
# Supabase-backed team ledger for the shared dashboard. Same shape as
# team: in ~/.config/agent-valley/settings.yaml; project values win.
# Activates only when supabase_url + supabase_anon_key + id are ALL set
# AND a valid Supabase session exists on disk (run `av login`). Any other
# state (fields missing, or not logged in) is a silent no-op — single-node
# setups are never blocked from booting.
# team:
#   supabase_url: https://xxx.supabase.co
#   supabase_anon_key: your-anon-key
#   id: my-team                       # Team identifier shared by all nodes
#   display_name: my-node             # This node's display name on the dashboard
